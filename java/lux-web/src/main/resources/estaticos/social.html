     Ver docs/sitio-web.md. -->
<meta charset="utf-8">
<style>
  @font-face { font-family:"Source Serif"; src:url("../assets/fuentes/source-serif-4-latin.woff2") format("woff2"); font-weight:400 600; }
  @font-face { font-family:"JetBrains Mono"; src:url("../assets/fuentes/jetbrains-mono-latin.woff2") format("woff2"); font-weight:400 800; }
  :root { --papel:#000; --tinta:#eaf0fa; --acento:#ff3d9a; --apagado:#93a0bc; --linea:rgba(234,240,250,.18); }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1200px; height:630px; }
  body { background:var(--papel); color:var(--tinta); font-family:"Source Serif",Georgia,serif;
         padding:58px 64px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; }
  .cima { display:flex; align-items:center; gap:14px; }
  .marca { width:58px; height:auto; color:var(--acento); display:block; }
  .palabra { font-family:"JetBrains Mono",monospace; font-size:30px; font-weight:700; letter-spacing:-.02em; }
  .palabra em { font-style:normal; color:var(--acento); }
  .medio { display:flex; align-items:flex-end; gap:34px; padding-right:186px; }
  .texto { flex:1; min-width:0; }
  .ante { font-family:"JetBrains Mono",monospace; font-size:15px; font-weight:600;
          letter-spacing:.19em; text-transform:uppercase; color:var(--acento); margin-bottom:16px; }
  h1 { font-family:"JetBrains Mono",monospace; font-size:92px; font-weight:800;
       letter-spacing:-.06em; line-height:.9; }
  h1 span { color:var(--acento); }
  .sub { font-size:23px; color:var(--apagado); margin-top:20px; max-width:30ch; line-height:1.45; }
  .ave { width:330px; height:auto; color:var(--tinta); flex:none; display:block; }
  .cifras { display:flex; border-top:2px solid var(--tinta); padding-top:18px; }
  .c { padding:0 26px; border-left:1px solid var(--linea); }
  .c:first-child { padding-left:0; border-left:0; }
  .c b { display:block; font-family:"JetBrains Mono",monospace; font-size:38px; font-weight:800; letter-spacing:-.03em; }
  .c i { font-style:normal; font-family:"JetBrains Mono",monospace; font-size:13px;
         letter-spacing:.15em; text-transform:uppercase; color:var(--apagado); }
</style>
