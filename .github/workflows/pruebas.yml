name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  nucleo:
    name: java/ · JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        jdk: ['25']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: cero
          POSTGRES_DB: ceropruebas
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: cero
          MYSQL_DATABASE: ceropruebas
        ports: ['53306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          check-latest: true
          cache: maven

      - name: Pruebas
        working-directory: java
        run: |
          set -o pipefail
          mvn -B install | tee ../pruebas.log

      - name: Ningún motor quedó sin probar
        run: |
          if grep -q "no está accesible" pruebas.log; then
            echo "::error::Un motor real no estaba accesible: MotorTests se omitió."
            grep "no está accesible" pruebas.log
            exit 1
          fi
          echo "H2, PostgreSQL y MySQL se probaron de verdad."

      - name: Cero dependencias en runtime
        working-directory: java
        run: |
          mvn -B -q dependency:list -DincludeScope=runtime -DexcludeGroupIds=dev.ginit.cero \
              -DoutputFile=target/deps.txt -pl cero-http,cero-core,cero-data,cero-test -am
          fuera=$(grep -h ':jar:' cero-*/target/deps.txt || true)
          if [ -n "$fuera" ]; then
            echo "::error::El núcleo arrastra dependencias externas:"; echo "$fuera"; exit 1
          fi
          echo "El núcleo no depende de nada fuera del JDK."

      - name: Empaquetar
        working-directory: java
        run: mvn -B -DskipTests package

      - uses: actions/upload-artifact@v4
        if: matrix.jdk == '25'
        with:
          name: jars
          path: java/*/target/*.jar
          retention-days: 14

  conformidad-http2:
    name: java/ · banco, ataques y h2spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven

      - name: Compilar
        working-directory: java
        run: mvn -B -q -DskipTests -pl cero-http -am install

      - name: El banco, los ataques y h2spec
        run: |
          set -o pipefail
          CLASES=java/cero-http/target/classes:java/cero-http/target/test-classes
          java -cp "$CLASES" cero.http.Conforme 8777 &
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8777/ && break || sleep 1; done

          python3 spec/banco/correr.py 127.0.0.1 8777
          python3 spec/banco/ataques.py java -cp "$CLASES" cero.http.Conforme

          curl -fsSL -o h2spec.tar.gz \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          tar -xzf h2spec.tar.gz

          ./h2spec -h 127.0.0.1 -p 8777 --timeout 5 | tee h2spec.log || true

          RESUMEN=$(grep -E "^[0-9]+ tests," h2spec.log | tail -1)
          echo "$RESUMEN"
          FALLOS=$(echo "$RESUMEN" | sed -E "s/.*, ([0-9]+) failed.*/\1/")
          if [ "${FALLOS:-99}" -gt 1 ]; then
            echo "::error::h2spec encontró $FALLOS fallos; solo se admite el 3.5.2 explicado."
            exit 1
          fi
          echo "Conforme salvo el 3.5.2, que asume un puerto dedicado a h2c."

  rust:
    name: rust/ · pruebas, banco y h2spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Requisitos citados por las pruebas
        working-directory: rust
        run: |
          N=$(grep -rhoiE '(HTTP|OBS|RUT|SEG|SES|H2)[-_][0-9]{3}' cero-http/tests cero-data/tests \
              | tr a-z_ A-Z- | sort -u | wc -l)
          echo "$N requisitos distintos"
          if [ "$N" -lt 159 ]; then
            echo "::error::Las pruebas de Rust citan $N requisitos; eran 159."
            exit 1
          fi

      - name: Pruebas y clippy
        working-directory: rust
        run: |
          cargo test --all
          cargo clippy --all-targets -- -D warnings

      - name: El banco de conformidad y h2spec
        working-directory: rust
        run: |
          set -o pipefail
          cargo build --release --bin conforme
          ./target/release/conforme 8777 &
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8777/ && break || sleep 1; done

          python3 ../spec/banco/correr.py 127.0.0.1 8777
          python3 ../spec/banco/ataques.py ./target/release/conforme

          curl -fsSL -o h2spec.tar.gz \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          tar -xzf h2spec.tar.gz

          ./h2spec -h 127.0.0.1 -p 8777 --timeout 5 | tee h2spec.log || true
          RESUMEN=$(grep -E "^[0-9]+ tests," h2spec.log | tail -1)
          echo "$RESUMEN"
          FALLOS=$(echo "$RESUMEN" | sed -E "s/.*, ([0-9]+) failed.*/\1/")
          if [ "${FALLOS:-99}" -gt 1 ]; then
            echo "::error::h2spec encontró $FALLOS fallos en Rust; solo se admite el 3.5.2."
            exit 1
          fi

  cxx:
    name: c++/ · pruebas, banco, ataques y h2spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Requisitos citados por las pruebas
        working-directory: c++
        run: |
          N=$(grep -rhoiE '(HTTP|OBS|RUT|SEG|SES|H2)[-_][0-9]{3}' pruebas \
              | tr a-z_ A-Z- | sort -u | wc -l)
          echo "$N requisitos distintos"
          if [ "$N" -lt 157 ]; then
            echo "::error::Las pruebas de C++ citan $N requisitos; eran 157."
            exit 1
          fi

      - name: Compilar y probar
        working-directory: c++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: El banco de conformidad y h2spec
        working-directory: c++
        run: |
          set -o pipefail
          ./build/conforme 8777 &
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8777/ && break || sleep 1; done

          python3 ../spec/banco/correr.py 127.0.0.1 8777
          python3 ../spec/banco/ataques.py ./build/conforme

          curl -fsSL -o h2spec.tar.gz \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          tar -xzf h2spec.tar.gz

          ./h2spec -h 127.0.0.1 -p 8777 --timeout 5 | tee h2spec.log || true
          RESUMEN=$(grep -E "^[0-9]+ tests," h2spec.log | tail -1)
          echo "$RESUMEN"
          FALLOS=$(echo "$RESUMEN" | sed -E "s/.*, ([0-9]+) failed.*/\1/")
          if [ "${FALLOS:-99}" -gt 1 ]; then
            echo "::error::h2spec encontró $FALLOS fallos en C++; solo se admite el 3.5.2."
            exit 1
          fi

  comentarios:
    name: código sin comentarios y en orden
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sin comentarios
        run: python3 herramientas/comentarios.py --verificar java rust c++ herramientas

      - name: Las pruebas de la herramienta
        run: python3 -I herramientas/pruebas_comentarios.py

      - name: En orden
        run: sh herramientas/verificar-orden.sh

  dependencias:
    name: dependencias con CVE conocido
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven

      - name: Inventario y aviso
        working-directory: java
        run: |
          mvn -B -q -DskipTests install
          mvn -B -q dependency:list -DincludeScope=test -DoutputFile=deps.txt
          echo "== lo que se declara =="
          grep -h ':jar:' */deps.txt | sed 's/^ *//' | sort -u

      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
