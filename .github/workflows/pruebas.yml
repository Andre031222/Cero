name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  # El núcleo, en Linux, con PostgreSQL y MySQL de verdad detrás. Sin las bases
  # levantadas, MotorTests se omite en silencio y la corrida miente por omisión;
  # por eso hay un paso que falla si algún motor no se pudo alcanzar.
  nucleo:
    name: java/ · JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Solo 25: el pom compila con `release 25` y el javac de 21 no acepta un objetivo
        # mayor que el suyo, así que ese trabajo fallaba al compilar antes de la primera
        # prueba. Queda la matriz por si vuelve a haber más de una versión que sostener.
        jdk: ['25']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: cero
          POSTGRES_DB: ceropruebas
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: cero
          MYSQL_DATABASE: ceropruebas
        ports: ['53306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Pruebas
        working-directory: java
        # pipefail explícito: el shell por defecto de Actions es `bash -e`, sin él un
        # `mvn` en rojo quedaría tapado por el `tee` y el paso saldría en verde.
        run: |
          set -o pipefail
          # install y no test: los pasos de después piden los artefactos por módulo, y con
          # `test` no llegan al repositorio local. Además es lo mismo que hace quien instala.
          mvn -B install | tee ../pruebas.log

      - name: Ningún motor quedó sin probar
        run: |
          if grep -q "no está accesible" pruebas.log; then
            echo "::error::Un motor real no estaba accesible: MotorTests se omitió."
            grep "no está accesible" pruebas.log
            exit 1
          fi
          echo "H2, PostgreSQL y MySQL se probaron de verdad."

      - name: Cero dependencias en runtime
        working-directory: java
        run: |
          mvn -B -q dependency:list -DincludeScope=runtime -DexcludeGroupIds=dev.ginit.cero \
              -DoutputFile=target/deps.txt -pl cero-http,cero-core,cero-view,cero-data -am
          fuera=$(grep -h ':jar:' cero-*/target/deps.txt || true)
          if [ -n "$fuera" ]; then
            echo "::error::El núcleo arrastra dependencias externas:"; echo "$fuera"; exit 1
          fi
          echo "El núcleo no depende de nada fuera del JDK."

      - name: Empaquetar
        working-directory: java
        run: mvn -B -DskipTests package

      - uses: actions/upload-artifact@v4
        if: matrix.jdk == '25'
        with:
          name: jars
          path: java/*/target/*.jar
          retention-days: 14

  # h2spec es la suite de conformidad de HTTP/2 del ecosistema, escrita por otros. Las pruebas
  # propias comprueban lo que se nos ocurrió comprobar; esta comprueba lo que dice el RFC. La
  # primera vez que se pasó encontró 22 fallos que las propias no veían.
  conformidad-http2:
    name: h2spec · conformidad HTTP/2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar
        working-directory: java
        run: mvn -B -q -DskipTests -pl cero-http -am install

      - name: h2spec
        run: |
          set -o pipefail
          curl -fsSL -o h2spec.tar.gz \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          tar -xzf h2spec.tar.gz

          # Un servidor mínimo, en segundo plano, sobre el jar recién compilado.
          mkdir -p /tmp/h2 && cat > /tmp/h2/Conforme.java <<'JAVA'
          import cero.http.*;
          public class Conforme {
              public static void main(String[] a) throws Exception {
                  Server.start(8777, (req, res) -> res.text("ok")).await();
              }
          }
          JAVA
          JAR=$(ls java/cero-http/target/cero-http-*.jar | head -1)
          javac -cp "$JAR" -d /tmp/h2 /tmp/h2/Conforme.java
          java -cp "$JAR:/tmp/h2" Conforme &
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8777/ && break || sleep 1; done

          # El caso 3.5.2 no aplica: manda «INVALID CONNECTION PREFACE», que en un puerto
          # compartido con HTTP/1.1 es una petición con un método que no existe, y la respuesta
          # correcta es 501 y no un GOAWAY binario. Asume un puerto dedicado a h2c.
          ./h2spec -h 127.0.0.1 -p 8777 --timeout 5 | tee h2spec.log || true
          FALLOS=$(grep -cE "^\s+×" h2spec.log || true)
          echo "fallos: $FALLOS"
          if [ "$FALLOS" -gt 1 ]; then
            echo "::error::h2spec encontró $FALLOS fallos; solo se admite el 3.5.2 explicado."
            exit 1
          fi

  # Las dependencias que sí se distribuyen son cero, pero las de prueba se compilan y se
  # ejecutan aquí: una vulnerable es una vulnerable en la máquina de quien compile el proyecto.
  dependencias:
    name: dependencias con CVE conocido
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Inventario y aviso
        working-directory: java
        run: |
          mvn -B -q dependency:list -DincludeScope=test -DoutputFile=deps.txt
          echo "== lo que se declara =="
          grep -h ':jar:' */deps.txt | sed 's/^ *//' | sort -u

      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

  # El sitio se genera. Que nadie edite el HTML publicado a mano y se desincronice.
  sitio:
    name: docs/web al día
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Regenerar y comprobar que no cambia nada
        run: |
          python3 docs/web/construir.py
          python3 docs/web/a-plantillas.py
          # Las plantillas y los recursos de cero-web son copias de docs/web. Tres veces se
          # quedaron atrás sin que nadie lo viera —terminal.js con el contador viejo, social.png
          # y el favicon con la paleta anterior—, así que ahora lo comprueba la máquina.
          if ! git diff --quiet -- docs/web java/cero-web/src/main/resources; then
            echo "::error::El sitio o las copias de cero-web están desincronizados. Corre ./cero build y commitea."
            git diff --stat -- docs/web java/cero-web/src/main/resources
            exit 1
          fi
          echo "El sitio publicado y las copias de cero-web coinciden con sus fuentes."
