<style>
  :root {
    color-scheme: light dark;

    --papel: #faf9f7;
    --tinta: #191c21;
    --apagado: #6d7178;
    --linea: rgba(25, 28, 33, .14);
    --laton: #8a6216;

    --term-fondo: #f4f2ee;
    --term-barra: #e8e5df;
    --term-texto: #24282e;
    --term-tenue: #7c8189;
    --term-prompt: #8a6216;
    --term-ok: #2f6f4e;
    --term-dato: #1f5f8b;
    --term-borde: rgba(25, 28, 33, .13);
    --term-relleno: rgba(138, 98, 22, .18);
    --term-brillo: none;

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --papel: #000; --tinta: #e9e7e2; --apagado: #8d9299;
      --linea: rgba(233, 231, 226, .18); --laton: #c79637;
      --term-fondo: #000; --term-barra: #0b0c0e; --term-texto: #d8d6d1;
      --term-tenue: #6c7178; --term-prompt: #c79637; --term-ok: #5fb98a;
      --term-dato: #5aa9d6; --term-borde: rgba(233, 231, 226, .16);
      --term-relleno: rgba(199, 150, 55, .3);
      --term-brillo: 0 0 26px rgba(199, 150, 55, .07) inset;
    }
  }
  :root[data-theme="dark"] {
    --papel: #000; --tinta: #e9e7e2; --apagado: #8d9299;
    --linea: rgba(233, 231, 226, .18); --laton: #c79637;
    --term-fondo: #000; --term-barra: #0b0c0e; --term-texto: #d8d6d1;
    --term-tenue: #6c7178; --term-prompt: #c79637; --term-ok: #5fb98a;
    --term-dato: #5aa9d6; --term-borde: rgba(233, 231, 226, .16);
    --term-relleno: rgba(199, 150, 55, .3);
    --term-brillo: 0 0 26px rgba(199, 150, 55, .07) inset;
  }
  :root[data-theme="light"] {
    --papel: #faf9f7; --tinta: #191c21; --apagado: #6d7178;
    --linea: rgba(25, 28, 33, .14); --laton: #8a6216;
    --term-fondo: #f4f2ee; --term-barra: #e8e5df; --term-texto: #24282e;
    --term-tenue: #7c8189; --term-prompt: #8a6216; --term-ok: #2f6f4e;
    --term-dato: #1f5f8b; --term-borde: rgba(25, 28, 33, .13);
    --term-relleno: rgba(138, 98, 22, .18); --term-brillo: none;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; padding: 2.5rem 1.25rem 3rem;
    background: var(--papel); color: var(--tinta);
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .envoltura { max-width: 47rem; margin: 0 auto; }

  .cabecera {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem;
  }
  .titular { display: flex; align-items: center; gap: .8rem; }
  .logo { width: 2.4rem; height: 2.4rem; color: var(--laton); flex: none; }

  h1 {
    font-family: var(--mono); font-size: 1.05rem; font-weight: 700;
    letter-spacing: .13em; text-transform: uppercase; margin: 0 0 .25rem;
  }
  h1 em { font-style: normal; color: var(--laton); }
  .subtitulo { color: var(--apagado); font-size: .875rem; margin: 0; max-width: 30rem; }

  .mandos { display: flex; gap: .4rem; align-items: center; }
  .conmutador { display: inline-flex; border: 1px solid var(--linea); border-radius: 5px; overflow: hidden; }
  .conmutador button {
    font-family: var(--mono); font-size: .6875rem; font-weight: 600; letter-spacing: .1em;
    padding: .32rem .6rem; border: 0; background: transparent; color: var(--apagado);
    cursor: pointer; transition: background .15s, color .15s;
  }
  .conmutador button + button { border-left: 1px solid var(--linea); }
  .conmutador button[aria-pressed="true"] { background: var(--laton); color: var(--papel); }
  .conmutador button:hover:not([aria-pressed="true"]) { color: var(--tinta); }

  .accion {
    font-family: var(--mono); font-size: .6875rem; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; padding: .38rem .7rem; border: 1px solid var(--linea);
    border-radius: 5px; background: transparent; color: var(--apagado); cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .accion:hover { color: var(--laton); border-color: var(--laton); }
  button:focus-visible { outline: 2px solid var(--laton); outline-offset: 2px; }

  .terminal {
    background: var(--term-fondo); border: 1px solid var(--term-borde);
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.07), var(--term-brillo);
  }
  @media (prefers-color-scheme: dark) { .terminal { box-shadow: var(--term-brillo); } }
  :root[data-theme="dark"] .terminal { box-shadow: var(--term-brillo); }

  .barra {
    display: flex; align-items: center; gap: .5rem;
    padding: .55rem .8rem; background: var(--term-barra);
    border-bottom: 1px solid var(--term-borde);
  }
  .luces { display: flex; gap: .38rem; }
  .luz { width: 11px; height: 11px; border-radius: 50%; }
  .luz:nth-child(1) { background: #ff5f57; }
  .luz:nth-child(2) { background: #febc2e; }
  .luz:nth-child(3) { background: #28c840; }
  .barra .ruta {
    flex: 1; text-align: center; font-family: var(--mono);
    font-size: .6875rem; color: var(--term-tenue); letter-spacing: .04em;
  }

  .pantalla {
    font-family: var(--mono); font-size: .78rem; line-height: 1.72;
    padding: .9rem 1rem 1.1rem;
    min-height: 24rem; max-height: 24rem; overflow-y: auto;
    color: var(--term-texto); white-space: pre-wrap; word-break: break-word;
  }
  .pantalla::-webkit-scrollbar { width: 8px; }
  .pantalla::-webkit-scrollbar-thumb { background: var(--term-borde); border-radius: 4px; }

  .linea { display: block; }
  .prompt { color: var(--term-prompt); font-weight: 600; }
  .tenue { color: var(--term-tenue); }
  .ok { color: var(--term-ok); }
  .dato { color: var(--term-dato); }
  .destacado { color: var(--term-texto); font-weight: 600; }
  .marca-ascii { color: var(--term-prompt); }

  .cursor {
    display: inline-block; width: .55em; height: 1.05em;
    background: var(--term-prompt); vertical-align: text-bottom; margin-left: 1px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .cursor { animation: latir 1.05s step-end infinite; }
    @keyframes latir { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
  }

  .pasos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    margin-top: 1.5rem; border-top: 1px solid var(--linea); border-left: 1px solid var(--linea);
  }
  .paso {
    border-right: 1px solid var(--linea); border-bottom: 1px solid var(--linea);
    padding: .7rem .8rem .8rem; transition: background .25s;
  }
  .paso[data-activo="si"] { background: var(--laton); }
  .paso[data-activo="si"] * { color: var(--papel) !important; }
  .paso[data-activo="hecho"] .n { color: var(--term-ok); }
  .paso .n { font-family: var(--mono); font-size: .625rem; font-weight: 700; letter-spacing: .14em; color: var(--laton); }
  .paso .que { font-size: .8125rem; margin-top: .12rem; }
  .paso .cuanto { font-family: var(--mono); font-size: .6875rem; color: var(--apagado); margin-top: .1rem; }

  .nota {
    margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--linea);
    font-size: .8125rem; color: var(--apagado); max-width: 38rem;
  }
  .nota code {
    font-family: var(--mono); font-size: .9em; background: var(--linea);
    padding: .08em .3em; border-radius: 3px; color: var(--tinta);
  }
</style>

      { t: 'cmd', v: 'java -cp ejemplo/target/classes:$CP ejemplo.App' },
      { t: 'ascii' },
      { t: 'out', v: 'lux · http://0.0.0.0:8080 · 9 rutas · 9 ms', cls: 'destacado' },
      { t: 'blank' },

      { t: 'cm', v: es ? '# 4 — comprobar que responde' : '# 4 — check that it answers', paso: 3 },
      { t: 'cmd', v: 'curl localhost:8080/api/tareas' },
      { t: 'out', v: '{"data":[],"page":1,"size":20,"total":0}', cls: 'dato' },
      { t: 'blank' },
      { t: 'cmd', v: "curl -X POST -H 'Content-Type: application/json' \\" },
      { t: 'cmd2', v: '     -d \'{"titulo":"Probar LuxCore","prioridad":"alta"}\' \\' },
      { t: 'cmd2', v: '     localhost:8080/api/tareas' },
      { t: 'out', v: '{"id":1,"titulo":"Probar LuxCore","prioridad":"alta","completada":false}', cls: 'dato' },
      { t: 'blank' },
      { t: 'out', v: es ? '# listo. sin contenedor, sin web.xml, sin dependencias.'
                        : '# done. no container, no web.xml, no dependencies.', cls: 'ok' }
    ];
  }

  var pantalla = document.getElementById('pantalla');
  var rutaBarra = document.getElementById('rutaBarra');
  var contenedorPasos = document.getElementById('pasos');
  var btnEs = document.getElementById('btnEs');
  var btnEn = document.getElementById('btnEn');
  var btnRepetir = document.getElementById('btnRepetir');

  var idioma = 'es';
  var tiempos = [];
  var intervalos = [];
  var reducido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function limpiar() {
    tiempos.forEach(clearTimeout); tiempos = [];
    intervalos.forEach(clearInterval); intervalos = [];
    pantalla.textContent = '';
  }
  function esperar(ms, fn) { tiempos.push(setTimeout(fn, ms)); }
  function abajo() { pantalla.scrollTop = pantalla.scrollHeight; }

  function nuevaLinea(clase) {
    var l = document.createElement('span');
    l.className = 'linea' + (clase ? ' ' + clase : '');
    pantalla.appendChild(l);
    return l;
  }

  function pintarPasos() {
    contenedorPasos.innerHTML = '';
    textos[idioma].pasos.forEach(function (p) {
      var caja = document.createElement('div');
      caja.className = 'paso';
      caja.innerHTML = '<div class="n">' + p.n + '</div><div class="que">' + p.que +
                       '</div><div class="cuanto">' + p.cuanto + '</div>';
      contenedorPasos.appendChild(caja);
    });
  }

  function marcarPaso(indice) {
    Array.prototype.forEach.call(contenedorPasos.children, function (caja, i) {
      caja.dataset.activo = i === indice ? 'si' : (i < indice ? 'hecho' : 'no');
    });
  }

  function aplicarIdioma() {
    var t = textos[idioma];
    var titulo = document.getElementById('tituloGuia');
    var sub = document.getElementById('subtitulo');
    if (titulo) titulo.textContent = t.titulo;
    if (sub) sub.textContent = t.subtitulo;
    document.getElementById('nota').innerHTML = t.nota;
    btnRepetir.textContent = t.repetir;
    btnEs.setAttribute('aria-pressed', String(idioma === 'es'));
    btnEn.setAttribute('aria-pressed', String(idioma === 'en'));
    pintarPasos();
  }

  function escribir(destino, texto, alTerminar) {
    var i = 0;
    (function paso() {
      if (i >= texto.length) { abajo(); if (alTerminar) alTerminar(); return; }
      destino.textContent += texto.charAt(i++);
      abajo();
      tiempos.push(setTimeout(paso, 19 + (i % 3) * 4));
    })();
  }

  function girar(linea, etiqueta, dur, fin, cls) {
    var f = 0;
    var id = setInterval(function () {
      linea.textContent = ' ' + GIRO[f++ % GIRO.length] + '  ' + etiqueta;
      abajo();
    }, 70);
    intervalos.push(id);
    esperar(dur, function () {
      clearInterval(id);
      linea.className = 'linea' + (cls ? ' ' + cls : '');
      linea.textContent = fin;
      abajo();
    });
  }

  function barrear(linea, etiqueta, dur, cola) {
    var ANCHO = 22, t0 = Date.now();
    var id = setInterval(function () {
      var p = Math.min(1, (Date.now() - t0) / dur);
      var lleno = Math.round(p * ANCHO);
      linea.textContent = ' ' + etiqueta + ': ' +
        '█'.repeat(lleno) + '░'.repeat(ANCHO - lleno) +
        ' ' + String(Math.round(p * 100)).padStart(3) + '%';
      abajo();
      if (p >= 1) {
        clearInterval(id);
        linea.textContent = ' ' + etiqueta + ': 100% (' + cola + '), done.';
      }
    }, 45);
    intervalos.push(id);
  }

  function contar(linea, hasta, dur, plantilla) {
    var t0 = Date.now();
    var id = setInterval(function () {
      var p = Math.min(1, (Date.now() - t0) / dur);
      var n = Math.round(p * p * (3 - 2 * p) * hasta);
      linea.textContent = plantilla.replace('{n}', n);
      abajo();
      if (p >= 1) { clearInterval(id); linea.textContent = plantilla.replace('{n}', hasta); }
    }, 45);
    intervalos.push(id);
  }

  function pintarAscii(stagger) {
    ASCII.forEach(function (fila, i) {
      esperar(stagger ? i * 65 : 0, function () {
        nuevaLinea('marca-ascii').textContent = fila;
        abajo();
      });
    });
  }

  function reproducir() {
    limpiar();
    rutaBarra.textContent = '~/proyectos';
    marcarPaso(-1);

    var pasos = guion(idioma);

    if (reducido) {
      pasos.forEach(function (p) {
        if (p.t === 'blank') { nuevaLinea().textContent = ' '; return; }
        if (p.t === 'ascii') { ASCII.forEach(function (f) { nuevaLinea('marca-ascii').textContent = f; }); return; }
        if (p.t === 'giro') { nuevaLinea(p.cls).textContent = p.fin; return; }
        if (p.t === 'barra') { nuevaLinea('tenue').textContent = ' ' + p.etiqueta + ': 100% (' + p.cola + '), done.'; return; }
        if (p.t === 'contar') { nuevaLinea(p.cls).textContent = p.plantilla.replace('{n}', p.hasta); return; }
        if (p.t === 'cm') { nuevaLinea('tenue').textContent = p.v; return; }
        if (p.t === 'cmd' || p.t === 'cmd2') {
          var l = nuevaLinea();
          if (p.t === 'cmd') { var pr = document.createElement('span'); pr.className = 'prompt'; pr.textContent = '$ '; l.appendChild(pr); }
          var c = document.createElement('span'); c.textContent = p.v; l.appendChild(c);
          if (p.ruta) rutaBarra.textContent = p.ruta;
          return;
        }
        nuevaLinea(p.cls).textContent = p.v;
      });
      marcarPaso(3);
      abajo();
      return;
    }

    var retraso = 300;

    pasos.forEach(function (p) {
      if (p.paso !== undefined) {
        (function (i) { esperar(retraso, function () { marcarPaso(i); }); })(p.paso);
      }

      switch (p.t) {
        case 'blank':
          esperar(retraso, function () { nuevaLinea().textContent = ' '; abajo(); });
          retraso += 85;
          break;

        case 'cm':
          (function (v) { esperar(retraso, function () { nuevaLinea('tenue').textContent = v; abajo(); }); })(p.v);
          retraso += 400;
          break;

        case 'cmd':
        case 'cmd2':
          (function (v, conPrompt, ruta) {
            esperar(retraso, function () {
              var l = nuevaLinea();
              if (conPrompt) {
                var pr = document.createElement('span');
                pr.className = 'prompt'; pr.textContent = '$ ';
                l.appendChild(pr);
              }
              var cuerpo = document.createElement('span');
              l.appendChild(cuerpo);
              var cur = document.createElement('i');
              cur.className = 'cursor';
              l.appendChild(cur);
              escribir(cuerpo, v, function () {
                cur.remove();
                if (ruta) rutaBarra.textContent = ruta;
              });
            });
          })(p.v, p.t === 'cmd', p.ruta);
          retraso += 240 + p.v.length * 21;
          break;

        case 'giro':
          (function (etiqueta, dur, fin, cls) {
            esperar(retraso, function () { girar(nuevaLinea('tenue'), etiqueta, dur, fin, cls); });
          })(p.v, p.dur, p.fin, p.cls);
          retraso += p.dur + 110;
          break;

        case 'barra':
          (function (etiqueta, dur, cola) {
            esperar(retraso, function () { barrear(nuevaLinea('tenue'), etiqueta, dur, cola); });
          })(p.etiqueta, p.dur, p.cola);
          retraso += p.dur + 140;
          break;

        case 'contar':
          (function (hasta, dur, plantilla, cls) {
            esperar(retraso, function () { contar(nuevaLinea(cls), hasta, dur, plantilla); });
          })(p.hasta, p.dur, p.plantilla, p.cls);
          retraso += p.dur + 160;
          break;

        case 'ascii':
          (function () { esperar(retraso, function () { pintarAscii(true); }); })();
          retraso += ASCII.length * 65 + 180;
          break;

        default:
          (function (v, cls) {
            esperar(retraso, function () { nuevaLinea(cls).textContent = v; abajo(); });
          })(p.v, p.cls);
          retraso += 125;
      }
    });
  }

  btnEs.addEventListener('click', function () { if (idioma !== 'es') { idioma = 'es'; aplicarIdioma(); reproducir(); } });
  btnEn.addEventListener('click', function () { if (idioma !== 'en') { idioma = 'en'; aplicarIdioma(); reproducir(); } });
  btnRepetir.addEventListener('click', reproducir);

  aplicarIdioma();
  reproducir();
})();
</script>
</body>
</html>
